name: CI

# One Node version for laptops, CI and EAS, read from .nvmrc. A mismatch here is
# not cosmetic: CI spent 125 consecutive red runs on it - `npm ci` rejected a
# lockfile written by a different npm major, and a differently-hoisted TypeScript
# failed `tsc`. Both die BEFORE `npm test`, so the suite had never once executed in
# CI while the laptop reported everything green.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App - typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fails loudly and specifically when package.json and the lockfile disagree,
      # instead of surfacing as a generic EUSAGE deep in an install log. The same
      # drift also breaks EAS builds, so catching it here catches it there too.
      - name: Verify lockfile is in sync
        run: npm ci --dry-run
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm test -- --ci

  server:
    name: Server - typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Verify lockfile is in sync
        run: npm ci --dry-run
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
