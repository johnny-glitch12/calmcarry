# Fly.io deploy config for the CalmCarry API. `fly launch --no-deploy` then `fly deploy`.
# Set secrets first (see DEPLOY.md):
#   fly secrets set JWT_SECRET=... CMS_ADMIN_KEY=... DATABASE_URL=... \
#                   CDN_BASE_URL=... CDN_SIGNING_KEY=... CORS_ORIGINS=...
app = "calmcarry-api"
primary_region = "iad"

[build]

[env]
  PORT = "4000"
  # DEMO posture: dev mode so the showcase backend boots without the (not-yet-real)
  # CDN/social/IAP secrets the prod boot-guard requires, and so it seeds demo data.
  # For the real launch, set this to "production" and provide all prod secrets.
  NODE_ENV = "development"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
